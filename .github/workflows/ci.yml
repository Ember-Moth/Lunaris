name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - run: make install
      - run: make check
      - run: make install-web
      - run: make check-web
      - name: Verify generated API types
        run: git diff --exit-code -- web/src/api/schema.d.ts
      - name: Cross-build Linux binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -tags stdjson -trimpath -o "bin/lunaris-linux-$arch" .
          done
