schema_version: 1
credentials:
  - id: naive-alice
    secret_env: LUNARIS_NAIVE_ALICE_PASSWORD
  - id: naive-bob
    secret_env: LUNARIS_NAIVE_BOB_PASSWORD
  - id: ss-server
    secret_env: LUNARIS_SS_SERVER_KEY
  - id: ss-alice
    secret_env: LUNARIS_SS_ALICE_KEY
  - id: ss-bob
    secret_env: LUNARIS_SS_BOB_KEY
certificates:
  - id: server
    certificate_file: fullchain.pem
    private_key_file: privkey.pem
listeners:
  - id: naive-h2
    protocol: naive
    address: 127.0.0.1
    port: 8443
    credential_refs: [naive-alice, naive-bob]
    certificate_ref: server
    transport: {type: http}
    options:
      users:
        - {username: alice, credential_ref: naive-alice}
        - {username: bob, credential_ref: naive-bob}
  - id: naive-h3
    protocol: naive
    address: 127.0.0.1
    port: 8443
    credential_refs: [naive-alice, naive-bob]
    certificate_ref: server
    transport: {type: quic}
    options:
      users:
        - {username: alice, credential_ref: naive-alice}
        - {username: bob, credential_ref: naive-bob}
  - id: ss2022-multi
    protocol: shadowsocks
    address: 127.0.0.1
    port: 8388
    network: [tcp, udp]
    credential_refs: [ss-alice, ss-bob]
    options:
      method: 2022-blake3-aes-128-gcm
      server_key_ref: ss-server
    udp_over_tcp: true
    multiplex: {enabled: true}
