# SPDX-License-Identifier: GPL-3.0-only
# Generate keys with: lunaris keygen reality
# Replace the target and names with a real TLS 1.3 target before running.
schema_version: 1
credentials:
  - id: user
    secret_env: LUNARIS_UUID
  - id: reality-key
    secret_env: LUNARIS_REALITY_PRIVATE_KEY
listeners:
  - id: vless-reality
    protocol: vless
    address: 127.0.0.1
    port: 8443
    network: [tcp]
    credential_refs: [user]
    udp_over_tcp: true
    multiplex:
      enabled: true
      padding: true
    transport:
      type: reality
      reality:
        target: target.example.net:443
        server_names: [target.example.net]
        private_key_ref: reality-key
        short_ids: ["0102030405060708"]
        max_time_difference: 1m
        allow_legacy_clients: true
