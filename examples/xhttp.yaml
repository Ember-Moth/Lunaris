schema_version: 1
credentials:
  - id: device
    secret_env: LUNARIS_UUID
certificates:
  - id: server
    certificate_file: fullchain.pem
    private_key_file: privkey.pem
listeners:
  - id: vless-xhttp
    protocol: vless
    address: 127.0.0.1
    port: 8443
    credential_refs: [device]
    certificate_ref: server
    transport:
      type: xhttp
      path: /proxy
      xhttp:
        mode: auto
        http_version: h2
        extra:
          xPaddingBytes: "100-1000"
          scMaxEachPostBytes: 1000000
          scMaxBufferedBytes: 4194304
          scMaxTotalBufferedBytes: 67108864
  - id: vless-xhttp-h3
    protocol: vless
    address: 127.0.0.1
    port: 8443
    credential_refs: [device]
    certificate_ref: server
    transport:
      type: xhttp
      path: /proxy
      xhttp:
        mode: auto
        http_version: h3
