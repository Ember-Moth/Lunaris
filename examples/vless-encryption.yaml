schema_version: 1
credentials:
  - id: device
    secret_env: LUNARIS_UUID
  - id: vless-decryption
    secret_env: LUNARIS_VLESS_DECRYPTION
listeners:
  - id: encrypted-vless
    protocol: vless
    address: 127.0.0.1
    port: 8443
    credential_refs: [device]
    options:
      decryption_ref: vless-decryption
      flow: xtls-rprx-vision
    transport:
      type: tcp
