schema_version: 1

credentials:
  - id: personal
    secret_env: LUNARIS_SS_PASSWORD

listeners:
  - id: ss-main
    name: Personal Shadowsocks
    protocol: shadowsocks
    address: 127.0.0.1
    port: 8388
    network: [tcp, udp]
    credential_refs: [personal]
    options:
      method: chacha20-ietf-poly1305

limits:
  dial_timeout: 10s
  handshake_timeout: 10s
  udp_idle_timeout: 1m
  shutdown_timeout: 5s
  max_connections: 1024
  max_pending_handshakes: 128
  max_udp_sessions: 256
  udp_queue_size: 64
  max_udp_destinations: 64
