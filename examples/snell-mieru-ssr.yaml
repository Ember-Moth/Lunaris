schema_version: 1
credentials:
  - id: snell
    secret_env: LUNARIS_SNELL_PSK
  - id: alice
    secret_env: LUNARIS_ALICE_PASSWORD
  - id: bob
    secret_env: LUNARIS_BOB_PASSWORD
  - id: ssr-server
    secret_env: LUNARIS_SSR_SERVER_PASSWORD
listeners:
  - id: snell-v6
    protocol: snell
    address: 127.0.0.1
    port: 8388
    credential_refs: [snell]
    options:
      version: 6
      mode: default
  - id: mieru
    protocol: mieru
    address: 127.0.0.1
    port: 8389
    network: [tcp, udp]
    credential_refs: [alice, bob]
    options:
      users:
        - {username: alice, credential_ref: alice}
        - {username: bob, credential_ref: bob}
      user_hint_is_mandatory: true
      mtu: 1400
  - id: ssr
    protocol: shadowsocksr
    address: 127.0.0.1
    port: 8390
    network: [tcp, udp]
    credential_refs: [alice, bob]
    options:
      method: aes-128-cfb
      protocol: auth_aes128_sha1
      obfs: plain
      server_key_ref: ssr-server
      users:
        - {id: 1, credential_ref: alice}
        - {id: 2, credential_ref: bob}
