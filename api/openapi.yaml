                udp_over_tcp:
                    type: boolean
            required:
                - id
                - protocol
                - port
                - options
                - credential_refs
            type: object
        Listener_tuic:
            additionalProperties: false
            properties:
                address:
                    default: 127.0.0.1
                    maxLength: 253
                    type: string
                certificate_ref:
                    maxLength: 128
                    minLength: 1
                    type: string
                credential_refs:
                    items:
                        maxLength: 128
                        minLength: 1
                        type: string
                    maxItems: 4096
                    type: array
                enabled:
                    default: false
                    type: boolean
                id:
                    maxLength: 128
                    minLength: 1
                    type: string
                multiplex:
                    $ref: '#/components/schemas/Multiplex'
                name:
                    maxLength: 256
                    type: string
                network:
                    items:
                        enum:
                            - tcp
                            - udp
                        type: string
                    maxItems: 2
                    type: array
                options:
                    additionalProperties: false
                    properties:
                        congestion_control:
                            enum:
                                - ""
                                - cubic
                                - new_reno
                                - bbr
                            type: string
                        users:
                            items:
                                $ref: '#/components/schemas/TUICUser'
                            maxItems: 4096
                            type: array
                    required:
                        - users
                    type: object
