                        type: string
                    maxItems: 4096
                    type: array
                enabled:
                    default: false
                    type: boolean
                id:
                    maxLength: 128
                    minLength: 1
                    type: string
                multiplex:
                    $ref: '#/components/schemas/Multiplex'
                name:
                    maxLength: 256
                    type: string
                network:
                    items:
                        enum:
                            - tcp
                            - udp
                        type: string
                    maxItems: 2
                    type: array
                options:
                    anyOf:
                        - additionalProperties: false
                          properties: {}
                          type: object
                        - type: "null"
                port:
                    maximum: 65535
                    minimum: 1
                    type: integer
                protocol:
                    const: hysteria2
                    type: string
                transport:
                    $ref: '#/components/schemas/Transport'
                udp_over_tcp:
                    type: boolean
            required:
                - id
                - protocol
                - port
                - options
                - credential_refs
            type: object
        Listener_mieru:
            additionalProperties: false
            properties:
                address:
                    default: 127.0.0.1
                    maxLength: 253
                    type: string
                certificate_ref:
                    maxLength: 128
