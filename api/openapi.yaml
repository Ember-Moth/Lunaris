info:
    description: Implemented P5 API. One administrator; immutable proxy assets; versioned drafts; durable asynchronous application. Session cookie names differ between loopback HTTP and HTTPS. All responses are no-store. Header/TLS parsing failures can be rejected at the HTTP transport boundary.
    license:
        identifier: GPL-3.0-only
        name: GNU General Public License v3.0
    title: Lunaris management API
    version: 1.0.0
openapi: 3.1.0
paths:
    /api/v1/auth/login:
        post:
            operationId: login
            parameters:
                - $ref: '#/components/parameters/Origin'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    code:
                                        const: 0
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/Session'
                                    msg:
                                        type: string
                                required:
                                    - code
                                    - msg
                                    - data
                                type: object
                    description: Success
                    headers:
                        Set-Cookie:
                            description: HttpOnly; SameSite=Strict; Path=/; Secure and __Host- prefix on HTTPS.
                            schema:
                                maxLength: 1024
                                type: string
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Authentication, validation, conflict, limit or infrastructure error
            security: []
            summary: login
