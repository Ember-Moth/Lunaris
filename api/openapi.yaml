                    type: string
                credential_refs:
                    items:
                        maxLength: 128
                        minLength: 1
                        type: string
                    maxItems: 4096
                    type: array
                enabled:
                    default: false
                    type: boolean
                id:
                    maxLength: 128
                    minLength: 1
                    type: string
                multiplex:
                    $ref: '#/components/schemas/Multiplex'
                name:
                    maxLength: 256
                    type: string
                network:
                    items:
                        enum:
                            - tcp
                            - udp
                        type: string
                    maxItems: 2
                    type: array
                options:
                    additionalProperties: false
                    properties:
                        mtu:
                            anyOf:
                                - maximum: 9000
                                  minimum: 576
                                  type: integer
                                - const: 0
                                  type: integer
                        traffic_pattern:
                            maxLength: 65536
                            type: string
                        user_hint_is_mandatory:
                            type: boolean
                        users:
                            items:
                                $ref: '#/components/schemas/NamedUser'
                            maxItems: 4096
                            type: array
                    required:
                        - users
                    type: object
                port:
                    maximum: 65535
                    minimum: 1
                    type: integer
                protocol:
                    const: mieru
                    type: string
                transport:
                    $ref: '#/components/schemas/Transport'
                udp_over_tcp:
                    type: boolean
            required:
                - id
                - protocol
                - port
                - options
                - credential_refs
            type: object
        Listener_naive:
