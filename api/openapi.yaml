                    type: string
                multiplex:
                    $ref: '#/components/schemas/Multiplex'
                name:
                    maxLength: 256
                    type: string
                network:
                    items:
                        enum:
                            - tcp
                            - udp
                        type: string
                    maxItems: 2
                    type: array
                options:
                    additionalProperties: false
                    properties:
                        method:
                            enum:
                                - aes-128-gcm
                                - aes-256-gcm
                                - chacha20-ietf-poly1305
                                - 2022-blake3-aes-128-gcm
                                - 2022-blake3-aes-256-gcm
                                - 2022-blake3-chacha20-poly1305
                            type: string
                        server_key_ref:
                            maxLength: 128
                            minLength: 1
                            type: string
                    required:
                        - method
                    type: object
                port:
                    maximum: 65535
                    minimum: 1
                    type: integer
                protocol:
                    const: shadowsocks
                    type: string
                transport:
                    $ref: '#/components/schemas/Transport'
                udp_over_tcp:
                    type: boolean
            required:
