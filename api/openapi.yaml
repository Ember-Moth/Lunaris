                        type: string
                    maxItems: 2
                    type: array
                options:
                    additionalProperties: false
                    properties:
                        users:
                            items:
                                $ref: '#/components/schemas/NamedUser'
                            maxItems: 4096
                            type: array
                    required:
                        - users
                    type: object
                port:
