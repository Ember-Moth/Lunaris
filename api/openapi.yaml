components:
    parameters:
        CSRF:
            in: header
            name: X-CSRF-Token
            required: true
            schema:
                maxLength: 43
                minLength: 43
                type: string
        Cursor:
            in: query
            name: cursor
            schema:
                maxLength: 256
                type: string
        Idempotency:
            in: header
            name: Idempotency-Key
            required: true
            schema:
                maxLength: 128
                minLength: 1
                type: string
        IfMatch:
            description: One strong revision ETag, including quotes.
            in: header
            name: If-Match
            required: true
            schema:
                maxLength: 130
                type: string
        Limit:
            in: query
            name: limit
            schema:
                default: 50
                maximum: 100
                minimum: 1
                type: integer
        Origin:
            description: Must exactly match the configured management origin.
            in: header
            name: Origin
            required: true
            schema:
                maxLength: 512
                type: string
        ResourceID:
            in: path
            name: id
            required: true
            schema:
                maxLength: 128
                minLength: 1
                type: string
    schemas:
        Account:
            additionalProperties: false
            properties:
                id:
                    maxLength: 128
                    minLength: 1
                    type: string
                username:
                    maxLength: 64
                    type: string
            required:
                - id
                - username
            type: object
        ApplyAccepted:
            additionalProperties: false
            properties:
                operation:
                    $ref: '#/components/schemas/Operation'
                operation_id:
                    maxLength: 128
                    minLength: 1
                    type: string
            required:
                - operation_id
                - operation
            type: object
        ApplyRequest:
            additionalProperties: false
            properties:
                acknowledge_disconnects:
                    type: boolean
                plan_id:
                    maxLength: 128
                    minLength: 1
                    type: string
            required:
                - plan_id
            type: object
        AssetBindings:
            additionalProperties:
                maxLength: 128
                minLength: 1
                type: string
            description: Stable logical aliases to immutable asset IDs. No raw secrets or server file/environment paths.
            propertyNames:
                maxLength: 128
                minLength: 1
            type: object
        Capabilities:
            additionalProperties: false
            properties:
                connection_info_format:
                    const: parameters-v1
                    type: string
                credential_kinds:
                    items:
                        maxLength: 64
                        type: string
                    type: array
                protocols:
                    items:
                        $ref: '#/components/schemas/ProtocolCapability'
                    type: array
                schema_version:
                    const: 1
                    type: integer
                shadowsocks_methods:
                    items:
                        maxLength: 64
                        type: string
                    type: array
                snell_versions:
                    items:
                        minimum: 0
                        type: integer
                    type: array
                transports:
                    items:
                        $ref: '#/components/schemas/TransportCapability'
                    type: array
                vless_flows:
                    items:
                        maxLength: 64
                        type: string
                    type: array
            required:
                - schema_version
                - protocols
                - transports
                - shadowsocks_methods
                - vless_flows
                - snell_versions
                - credential_kinds
                - connection_info_format
            type: object
        CertificateAsset:
            additionalProperties: false
            properties:
                created_at:
                    format: date-time
                    type: string
                dns_names:
                    items:
                        maxLength: 253
                        type: string
                    type:
                        - array
                        - "null"
                fingerprint:
                    maxLength: 64
                    type: string
                id:
                    maxLength: 128
                    minLength: 1
                    type: string
                label:
                    maxLength: 256
                    type: string
                not_after:
                    format: date-time
                    type: string
                not_before:
                    format: date-time
                    type: string
                reference_count:
                    minimum: 0
                    type: integer
                references:
                    items:
                        $ref: '#/components/schemas/Reference'
                    maxItems: 100
                    type: array
                references_truncated:
                    type: boolean
                subject:
                    maxLength: 4096
                    type: string
            required:
                - id
                - label
                - created_at
                - references
                - reference_count
                - references_truncated
                - subject
                - dns_names
                - fingerprint
                - not_before
                - not_after
            type: object
        CertificateCreate:
            additionalProperties: false
            properties:
                certificate:
                    maxLength: 1.048576e+06
                    minLength: 1
                    type: string
                label:
                    maxLength: 256
                    type: string
                private_key:
                    maxLength: 1.048576e+06
                    minLength: 1
                    type: string
            required:
                - certificate
                - private_key
            type: object
        Change:
            additionalProperties: false
            properties:
                action:
                    enum:
                        - unchanged
                        - create
                        - replace
                        - disable
                        - remove
                        - recover
                    type: string
                closes_connections:
                    type: boolean
                id:
                    maxLength: 128
                    minLength: 1
                    type: string
            required:
                - id
                - action
                - closes_connections
            type: object
        ConnectionInfo:
            additionalProperties: false
            description: Client-neutral connection parameters, not an importable client profile. Contains only the selected user secret and required shared plugin keys; TLS private keys, REALITY private keys and VLESS server decryption keys are never returned.
            properties:
                authentication:
                    additionalProperties: true
                    type: object
                committed_revision:
                    maxLength: 128
                    minLength: 1
                    type: string
                endpoint:
                    additionalProperties: false
                    properties:
                        host:
                            maxLength: 253
                            type: string
                        port:
                            maximum: 65535
                            minimum: 1
                            type: integer
                    required:
                        - host
                        - port
                    type: object
                format:
                    const: parameters-v1
                    type: string
                listen_network:
                    items:
                        maxLength: 8
                        type: string
                    type: array
                listener_id:
                    maxLength: 128
                    minLength: 1
                    type: string
                multiplex:
                    $ref: '#/components/schemas/Multiplex'
                protocol:
                    maxLength: 64
                    type: string
                protocol_options:
                    additionalProperties: true
                    type: object
                spec_digest:
                    maxLength: 64
                    type: string
                transport:
                    additionalProperties: true
                    type: object
                udp_over_tcp:
                    type: boolean
            required:
                - format
                - committed_revision
                - listener_id
                - spec_digest
                - protocol
                - listen_network
                - endpoint
                - authentication
                - protocol_options
                - transport
                - udp_over_tcp
                - multiplex
            type: object
        ConnectionRequest:
            additionalProperties: false
            properties:
                committed_revision:
                    maxLength: 128
                    minLength: 1
                    type: string
                credential_ref:
                    maxLength: 128
                    minLength: 1
                    type: string
                host:
                    maxLength: 253
                    minLength: 1
                    type: string
                port:
                    maximum: 65535
                    minimum: 1
                    type: integer
                server_name:
                    maxLength: 253
                    type: string
            required:
                - committed_revision
                - host
            type: object
        CredentialAsset:
            additionalProperties: false
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    maxLength: 128
                    minLength: 1
                    type: string
                kind:
                    maxLength: 64
                    type: string
                label:
                    maxLength: 256
                    type: string
                reference_count:
                    minimum: 0
                    type: integer
                references:
                    items:
                        $ref: '#/components/schemas/Reference'
                    maxItems: 100
                    type: array
                references_truncated:
                    type: boolean
            required:
                - id
                - label
                - created_at
                - references
                - reference_count
                - references_truncated
                - kind
            type: object
        CredentialCreate:
            additionalProperties: false
            description: Exactly one of secret or generate=true. Secret material is never returned by this endpoint.
            properties:
                generate:
                    type: boolean
                kind:
                    default: generic
                    enum:
                        - generic
                        - password
                        - uuid
                        - ss2022-128
                        - ss2022-256
                        - x25519
                        - vless-encryption
                    type: string
                label:
                    maxLength: 256
                    type: string
                secret:
                    maxLength: 4096
                    minLength: 1
                    type: string
            type: object
        DraftInput:
            additionalProperties: false
            properties:
                certificate_assets:
                    $ref: '#/components/schemas/AssetBindings'
                config:
                    $ref: '#/components/schemas/NodeConfig'
                credential_assets:
                    $ref: '#/components/schemas/AssetBindings'
            required:
                - config
            type: object
        Error:
            additionalProperties: false
            properties:
                code:
                    minimum: 1
                    type: integer
                data:
                    additionalProperties: true
                    type:
                        - object
                        - "null"
                msg:
                    maxLength: 2048
                    type: string
            required:
                - code
                - msg
                - data
            type: object
        FieldError:
            additionalProperties: false
            properties:
                code:
                    maxLength: 256
                    type: string
                message:
                    maxLength: 1024
                    type: string
                path:
                    maxLength: 256
                    type: string
            required:
                - path
                - code
                - message
            type: object
        Heads:
            additionalProperties: false
            properties:
                committed_revision:
                    maxLength: 128
                    minLength: 1
                    type: string
                draft_revision:
                    maxLength: 128
                    minLength: 1
                    type: string
            required:
                - draft_revision
                - committed_revision
            type: object
        Limits:
            additionalProperties: false
            properties:
                dial_timeout:
                    description: Nanoseconds. Defaults are applied when omitted.
                    format: int64
                    maximum: 8.64e+13
                    minimum: 1
                    type: integer
                handshake_timeout:
                    description: Nanoseconds. Defaults are applied when omitted.
                    format: int64
                    maximum: 8.64e+13
                    minimum: 1
                    type: integer
                max_connections:
                    maximum: 65536
                    minimum: 1
                    type: integer
                max_pending_handshakes:
                    maximum: 65536
                    minimum: 1
                    type: integer
                max_udp_destinations:
                    maximum: 65536
                    minimum: 1
                    type: integer
                max_udp_sessions:
                    maximum: 65536
                    minimum: 1
                    type: integer
                shutdown_timeout:
                    description: Nanoseconds. Defaults are applied when omitted.
                    format: int64
                    maximum: 8.64e+13
                    minimum: 1
                    type: integer
                udp_idle_timeout:
                    description: Nanoseconds. Defaults are applied when omitted.
                    format: int64
                    maximum: 8.64e+13
                    minimum: 1
                    type: integer
                udp_queue_size:
                    maximum: 1024
                    minimum: 1
                    type: integer
            type: object
        Listener:
            discriminator:
                mapping:
                    anytls: '#/components/schemas/Listener_anytls'
                    hysteria2: '#/components/schemas/Listener_hysteria2'
                    mieru: '#/components/schemas/Listener_mieru'
                    naive: '#/components/schemas/Listener_naive'
                    shadowsocks: '#/components/schemas/Listener_shadowsocks'
                    shadowsocksr: '#/components/schemas/Listener_shadowsocksr'
                    snell: '#/components/schemas/Listener_snell'
                    trojan: '#/components/schemas/Listener_trojan'
                    tuic: '#/components/schemas/Listener_tuic'
                    vless: '#/components/schemas/Listener_vless'
                    vmess: '#/components/schemas/Listener_vmess'
                propertyName: protocol
            oneOf:
                - $ref: '#/components/schemas/Listener_shadowsocks'
                - $ref: '#/components/schemas/Listener_vless'
                - $ref: '#/components/schemas/Listener_vmess'
                - $ref: '#/components/schemas/Listener_trojan'
                - $ref: '#/components/schemas/Listener_anytls'
                - $ref: '#/components/schemas/Listener_hysteria2'
                - $ref: '#/components/schemas/Listener_tuic'
                - $ref: '#/components/schemas/Listener_naive'
                - $ref: '#/components/schemas/Listener_snell'
                - $ref: '#/components/schemas/Listener_mieru'
                - $ref: '#/components/schemas/Listener_shadowsocksr'
        Listener_anytls:
            additionalProperties: false
            properties:
                address:
                    default: 127.0.0.1
                    maxLength: 253
                    type: string
                certificate_ref:
                    maxLength: 128
                    minLength: 1
                    type: string
                credential_refs:
                    items:
                        maxLength: 128
                        minLength: 1
                        type: string
                    maxItems: 4096
                    type: array
                enabled:
                    default: false
                    type: boolean
                id:
                    maxLength: 128
                    minLength: 1
                    type: string
                multiplex:
                    $ref: '#/components/schemas/Multiplex'
                name:
                    maxLength: 256
                    type: string
                network:
                    items:
                        enum:
                            - tcp
                            - udp
                        type: string
                    maxItems: 2
                    type: array
                options:
                    anyOf:
                        - additionalProperties: false
                          properties: {}
                          type: object
                        - type: "null"
                port:
                    maximum: 65535
                    minimum: 1
                    type: integer
                protocol:
                    const: anytls
                    type: string
                transport:
                    $ref: '#/components/schemas/Transport'
                udp_over_tcp:
                    type: boolean
            required:
                - id
                - protocol
                - port
                - options
                - credential_refs
            type: object
        Listener_hysteria2:
            additionalProperties: false
            properties:
                address:
                    default: 127.0.0.1
